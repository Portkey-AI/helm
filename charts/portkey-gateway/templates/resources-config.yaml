{{- if .Values.resourceConfig.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.resourceConfig.nameOverride | default "resource-config" }}
  labels:
    {{- include "portkeyenterprise.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.resourceConfig.data | nindent 2 }}
{{- end }}
